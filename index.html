<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>online shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <input type="text" id="search-input" />
    <button id="search-button">serch</button>
    <select id="category-select">
      <option value="all">All</option>
    </select>
    <button id="theme-button">Dark</button>
    <select id="sort-select">
      <option value="">Sort by</option>
      <option value="price-asc">Price: low to high</option>
      <option value="price-desc">Price: high to low</option>
      <option value="rating-desc">Best rating</option>
    </select>
    <button id="cart-button">Cart <span id="cart-count">0</span></button>
    <section id="main"></section>
    <div>
      <button id="prev-button">Previous</button>
      <span id="page-info">Page 1 of 17</span>
      <button id="next-button">Next</button>
    </div>

    <form id="checkout-form" novalidate>
      <label for="name-input">Name</label>
      <input type="text" id="name-input" />
      <span id="name-error"></span>

      <label for="email-input">Email</label>
      <input type="text" id="email-input" />
      <span id="email-error"></span>

      <label for="phone-input">Phone</label>
      <input type="text" id="phone-input" />
      <span id="phone-error"></span>

      <label for="address-input">Address</label>
      <input type="text" id="address-input" />
      <span id="address-error"></span>

      <button type="submit">Place order</button>
    </form>

    <script src="js/api.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
